[project]
name = "probot-keysight-pico-edge"
version = "0.1.0"
description = "PUDA edge service for the probot Keysight SMU + Pico light."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "puda==0.0.15",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "setuptools<81",
    "websocket-client>=1.8.0",
    "psutil>=6.1.1",
    # Device stack (SMU + Pico light + measurement math), formerly probot-drivers[smu].
    "pyvisa>=1.14.1",
    "g2vpico",          # Pico G2V LED controller (vendor API)
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",      # linregress (Keysight_Substrate_R)
]
