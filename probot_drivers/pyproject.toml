[project]
name = "probot-drivers"
version = "0.1.0"
description = "Shared hardware drivers for the probot platform (Keysight SMU, Pico G2V light, Ender stage) used by the PUDA edge services and the Tkinter GUI."
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Base import is dependency-free (lazy __init__). Each edge/GUI pulls what it needs
# via the extras below, so the lean stage edge does not install the SMU stack.
dependencies = []

[project.optional-dependencies]
# probot-stage edge: Ender 3-axis stage over serial.
stage = [
    "pyserial>=3.5",
    "controllably",     # Ender controller (vendor API)
]
# probot-keysight-pico edge: Keysight SMU (VISA) + Pico light + measurement commands.
# Machine commands are pure I/O returning raw data (no plotting/analysis), so no
# matplotlib/torch here. Analysis + plotting live agent-side (see ../skills-reference).
smu = [
    "pyvisa>=1.14.1",
    "g2vpico",          # Pico G2V LED controller (vendor API)
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",      # linregress (Keysight_Substrate_R)
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
probot_drivers = ["parameters/*.csv"]
